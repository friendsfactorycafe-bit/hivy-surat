<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#92400E"/>
      <stop offset="100%" style="stop-color:#78350F"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="50%" style="stop-color:#D97706"/>
      <stop offset="100%" style="stop-color:#B45309"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#D97706" stroke-width="1" opacity="0.3"/>
  <!-- Soft glow behind heart -->
  <ellipse cx="50" cy="48" rx="28" ry="26" fill="url(#glow)"/>
  <!-- Heart shape -->
  <path d="M50 78 C50 78 18 55 18 36 C18 25 27 18 36 18 C42 18 47 22 50 27 C53 22 58 18 64 18 C73 18 82 25 82 36 C82 55 50 78 50 78Z" fill="url(#heart)" filter="url(#shadow)"/>
  <!-- Heart highlight -->
  <path d="M36 22 C30 22 22 28 22 37 C22 40 23 43 25 46" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Sparkle top-left -->
  <path d="M24 18 L25.5 22 L29 23.5 L25.5 25 L24 29 L22.5 25 L19 23.5 L22.5 22Z" fill="#FEF08A" opacity="0.9"/>
  <!-- Sparkle top-right -->
  <path d="M76 14 L77 17 L80 18 L77 19 L76 22 L75 19 L72 18 L75 17Z" fill="#FEF08A" opacity="0.7"/>
  <!-- Sparkle small -->
  <circle cx="82" cy="30" r="1.5" fill="#FEF08A" opacity="0.8"/>
  <circle cx="16" cy="34" r="1.2" fill="#FEF08A" opacity="0.6"/>
</svg>
